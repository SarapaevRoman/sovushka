<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7A5CF0">
<meta name="description" content="Совушкина школа — сказки, задания, правила и энциклопедия для 1–2 класса">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Совушкина школа</title>
<style>
/* Layout: one-column game screens (home → map of 7 islands → task), bright single-theme "sunny sky" look */
:root{
  --sky:#E3F4FF; --sky2:#C9E9FF; --card:#FFFFFF; --ink:#23305E; --muted:#5D6B93;
  --sun:#FFC83D; --coral:#FF6F61; --mint:#1FB59B; --grape:#7A5CF0; --berry:#E2457F;
  --ok:#1FA36B; --okbg:#DDF7EA; --bad:#E5484D; --badbg:#FFE6E6; --hintbg:#FFF4CF;
  --display:"Comfortaa","Trebuchet MS","Segoe UI",sans-serif;
  --body:"Nunito","Segoe UI","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--sky);color:var(--ink)}
body{font-family:var(--body);font-size:18px;line-height:1.45;padding-inline:16px;padding-block:0 40px;
  background:radial-gradient(circle at 15% 8%,#fff 0 60px,transparent 61px),radial-gradient(circle at 85% 4%,#fff 0 40px,transparent 41px),var(--sky);background-attachment:scroll}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--grape);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding-block:10px;background:var(--sky)}
.back{width:44px;height:44px;border-radius:50%;background:var(--card);font-size:22px;font-weight:800;box-shadow:0 3px 0 var(--sky2)}
.bar h1{flex:1;font-size:20px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbtn{height:44px;border-radius:999px;padding:0 14px;background:var(--card);font-weight:800;box-shadow:0 3px 0 var(--sky2);white-space:nowrap}
.vbtn.on{background:var(--sun);box-shadow:0 3px 0 #D9A21E}
.sayb{border-radius:999px;padding:6px 12px;font-weight:800;font-size:15px;background:#EAF4FF;box-shadow:0 2px 0 var(--sky2);margin-left:6px;vertical-align:middle}
.owl{cursor:pointer}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 14px;font-weight:800;box-shadow:0 3px 0 var(--sky2);white-space:nowrap}
.pill .s{color:var(--sun);font-size:22px;line-height:1}

/* owl */
.owlrow{display:flex;align-items:flex-end;gap:12px;margin-block:8px 18px}
.owl{flex:0 0 auto;width:92px;height:92px}
.owl.small{width:58px;height:58px}
.bubble{position:relative;background:var(--card);border-radius:22px;padding:14px 16px;font-weight:700;box-shadow:0 4px 0 var(--sky2);min-width:0}
.bubble:before{content:"";position:absolute;left:-10px;bottom:18px;border:10px solid transparent;border-right-color:var(--card);border-left:0}

/* home */
.big{display:grid;gap:14px}
.bigbtn{display:flex;align-items:center;gap:16px;text-align:left;border-radius:26px;padding:20px;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.15);transition:transform .1s}
.bigbtn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.bigbtn .ic{flex:0 0 auto;width:64px;height:64px;border-radius:20px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:36px}
.bigbtn h2{font-size:24px}
.bigbtn p{margin:2px 0 0;font-weight:700;opacity:.95}
.b-play{background:var(--coral)} .b-learn{background:var(--mint)}

/* map */
.map{display:grid;gap:14px;padding-block:6px}
.isl{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:24px;padding:14px 16px;text-align:left;box-shadow:0 5px 0 var(--sky2);width:min(100%,520px)}
.isl:nth-child(even){margin-left:auto}
.isl .num{flex:0 0 auto;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:26px;font-weight:700;color:#fff}
.isl .t{font-weight:800;font-size:19px}
.isl .st{color:var(--sun);font-size:20px;letter-spacing:2px}
.isl .st i{color:#D6E4F0;font-style:normal}
.isl.done{outline:3px solid var(--sun)}

/* task screen */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{flex:1 1 0;min-width:96px;background:var(--card);border-radius:16px;padding:8px 10px;font-weight:800;font-size:15px;box-shadow:0 3px 0 var(--sky2);text-align:center}
.tab.on{background:var(--ink);color:#fff;box-shadow:none}
.tab small{display:block;color:var(--sun);font-size:14px;letter-spacing:1px}
.card{background:var(--card);border-radius:26px;padding:18px;box-shadow:0 6px 0 var(--sky2)}
.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;border-radius:999px;padding:4px 12px;margin-bottom:8px}
.tag.att{background:var(--coral)} .tag.wit{background:var(--grape)} .tag.trk{background:var(--berry)}
.card h2{font-size:24px;margin-bottom:8px}
.explain{background:#EAF4FF;border-radius:18px;padding:12px 14px;margin-block:10px;font-weight:600}
.do{font-weight:800;margin-block:12px 8px}
.hints{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.hbtn{flex:1 1 140px;border-radius:16px;padding:12px;font-weight:800;background:var(--hintbg);box-shadow:0 3px 0 #F2D98A}
.hbtn.help{background:#EFE9FF;box-shadow:0 3px 0 #D4C9FA}
.hbtn[disabled]{opacity:.5;cursor:default}
.hintbox{margin-top:12px;border-radius:16px;padding:12px 14px;font-weight:700;background:var(--hintbg)}
.hintbox.help{background:#EFE9FF}
.msg{min-height:28px;font-weight:800;margin-top:10px}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}

/* hunt */
.letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-block:10px}
.lt{width:46px;height:52px;border-radius:14px;background:#F2F7FC;font-family:var(--display);font-size:26px;font-weight:700;box-shadow:0 3px 0 #D7E4F1;position:relative}
.lt.g0{background:#FFE3DF;color:var(--coral)}
.lt.g0:after{content:"";position:absolute;left:8px;right:8px;top:50%;height:4px;border-radius:2px;background:var(--coral);transform:rotate(-20deg)}
.lt.g1{background:#E3DBFF;color:var(--grape);box-shadow:inset 0 0 0 4px var(--grape)}
.lt.flash{animation:flash .5s 3}
@keyframes flash{50%{background:var(--sun)}}
.counter{text-align:center;font-weight:800;font-size:20px}

/* chain / collect */
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-block:10px}
.word{font-family:var(--display);font-weight:700;font-size:22px;background:#F2F7FC;border-radius:14px;padding:8px 12px}
.arr{font-weight:800;color:var(--muted)}
input.w{font:inherit;font-weight:800;font-size:20px;width:120px;padding:9px 12px;border-radius:14px;border:3px solid #CFE0F0;background:#fff;color:var(--ink);text-transform:lowercase}
input.w.okk{border-color:var(--ok);background:var(--okbg)}
input.w.badd{border-color:var(--bad);background:var(--badbg)}
.go{border-radius:14px;padding:10px 18px;font-weight:800;background:var(--mint);color:#fff;box-shadow:0 3px 0 #168a76}
.group{border-top:2px dashed #DCE8F4;padding-top:12px;margin-top:12px}
.group:first-of-type{border-top:0;margin-top:0;padding-top:0}
.glab{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.12em;word-break:break-all;background:#FFF8DD;border-radius:14px;padding:8px 12px;display:inline-block}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--okbg);color:var(--ok);font-weight:800;border-radius:999px;padding:4px 12px}
.prog{font-weight:800;color:var(--muted);font-size:15px}

/* choice */
.pair{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-block:10px;border-top:2px dashed #DCE8F4}
.pair:first-child{border-top:0}
.pw{font-family:var(--display);font-weight:700;font-size:21px;flex:1 1 220px;min-width:0}
.pw b{color:var(--bad);text-decoration:underline}
.opt{border-radius:14px;padding:10px 14px;font-weight:800;background:#F2F7FC;box-shadow:0 3px 0 #D7E4F1;text-align:left}
.opt.right{background:var(--okbg);color:var(--ok);box-shadow:0 3px 0 #9fdcbc}
.opt.wrong{background:var(--badbg);color:var(--bad)}
.q{padding-block:12px;border-top:2px dashed #DCE8F4}
.q:first-child{border-top:0}
.q p{font-weight:800;margin:0 0 8px}
.opts{display:grid;gap:8px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* error text */
.etext{display:flex;flex-wrap:wrap;gap:6px;font-size:21px;line-height:1.3}
.tok{border-radius:10px;padding:4px 7px;background:#F2F7FC;font-weight:700}
.tok.fixed{background:var(--okbg);color:var(--ok)}
.tok.fixed s{color:var(--bad);font-weight:600;margin-right:4px}
.memo{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-block:12px}
.memo span{background:#FFF8DD;border-radius:14px;padding:8px 14px;font-weight:800;font-size:20px}

/* learn */
.subj{display:flex;gap:8px;margin-bottom:14px}
.subj button{flex:1;border-radius:18px;padding:12px;font-weight:800;background:var(--card);box-shadow:0 3px 0 var(--sky2)}
.subj button.on{background:var(--mint);color:#fff;box-shadow:0 3px 0 #168a76}
.subj button.on.m{background:var(--grape);box-shadow:0 3px 0 #5a40c7}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tp{background:var(--card);border-radius:20px;padding:14px;text-align:left;font-weight:800;box-shadow:0 4px 0 var(--sky2);display:flex;gap:10px;align-items:center}
.tp .n{flex:0 0 auto;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:var(--display)}
.tp.ru .n{background:var(--mint)} .tp.ma .n{background:var(--grape)}
.tp .ck{margin-left:auto;color:var(--ok)}
.lesson p{margin:0 0 10px;font-size:19px}
.example{background:#FFF8DD;border-radius:18px;padding:12px 14px;font-weight:700;margin-block:12px}
.example b{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#B38300;margin-bottom:4px}
.listen{border-radius:14px;padding:10px 16px;font-weight:800;background:#EAF4FF;box-shadow:0 3px 0 var(--sky2)}

/* party */
.party{position:fixed;inset:0;z-index:20;background:rgba(35,48,94,.55);display:grid;place-items:center;padding:16px}
.pbox{background:var(--card);border-radius:30px;padding:26px 22px;text-align:center;max-width:380px;width:100%}
.pbox h2{font-size:30px;margin-block:6px}
.pstars{font-size:52px;letter-spacing:6px;color:var(--sun)}
.pstars i{color:#D6E4F0;font-style:normal}
.pstars span{display:inline-block;animation:pop .5s both}
.pstars span:nth-child(2){animation-delay:.15s}.pstars span:nth-child(3){animation-delay:.3s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.pbox .go{margin-top:14px;font-size:20px;padding:12px 26px}

/* ---- tale ---- */
.blot.eraser{background:#F58BB0;border-radius:14px 14px 20px 20px;box-shadow:inset 0 calc(var(--s)*-.3) 0 #4F7BD9}
.blot.eraser .hat{border-bottom-color:#4F7BD9}
.bpart{display:block;font-weight:800;opacity:.9;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.bprog{font-size:14px;margin-top:6px!important;background:rgba(255,255,255,.22);display:inline-block;border-radius:999px;padding:2px 10px}
.b-tale{background:var(--grape)} .b-ref{background:var(--mint)}
.owl.mini{width:46px;height:46px}
.tpath{display:grid;gap:12px;position:relative;padding-block:4px}
.tpath:before{content:"";position:absolute;left:43px;top:20px;bottom:20px;border-left:4px dotted #B9D3EA}
.tnode{position:relative;display:flex;align-items:center;gap:14px;background:var(--card);border-radius:22px;padding:12px 14px;text-align:left;box-shadow:0 5px 0 var(--sky2)}
.tnode.locked{opacity:.6}
.tnode.done{box-shadow:0 5px 0 #F2D98A}
.ticon{flex:0 0 auto;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:30px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.tinfo{min-width:0;display:flex;flex-direction:column}
.tinfo small{color:var(--muted);font-weight:800;font-size:13px}
.tinfo b{font-family:var(--display);font-size:19px}
.tinfo .st{color:var(--sun);font-size:19px;letter-spacing:2px}
.tinfo .st i{color:#D6E4F0;font-style:normal}
.tinfo em{font-style:normal;color:var(--grape);font-size:15px;letter-spacing:0;font-weight:800}
.tnode.locked em{color:var(--muted)}
.chead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.chead .cnum{width:40px;height:40px;border-radius:14px;color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;flex:0 0 auto}
.chead b{display:block;font-family:var(--display)}
.chead small{color:var(--muted);font-weight:800}
.scene{display:flex;gap:14px;align-items:flex-start;background:var(--card);border-radius:26px;padding:18px;border-top:8px solid var(--grape);box-shadow:0 6px 0 var(--sky2);animation:rise .35s both}
.scene.bad{background:#F3EEFF}
@keyframes rise{from{transform:translateY(12px);opacity:.3}}
.por{flex:0 0 auto;width:72px;height:72px;border-radius:22px;background:#F2F7FC;display:grid;place-items:center;font-size:44px;line-height:1}
.stext{min-width:0;flex:1}
.sname{font-weight:800;color:var(--muted);font-size:14px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.stext p{margin:6px 0 0;font-size:21px;line-height:1.4;font-weight:700}
.snav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.dots{display:flex;gap:6px}
.dots span{width:10px;height:10px;border-radius:50%;background:#C9DDF0}
.dots span.on{background:var(--grape)}
.go.big{font-size:20px;padding:13px 24px}
.arena{background:#FFF8E8;border:4px solid var(--grape);border-radius:26px;padding:14px;margin-bottom:14px;position:relative;text-align:center}
.aintro{font-weight:800;margin-bottom:10px}
.stage{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;min-height:70px}
.blot{--s:52px;width:var(--s);height:calc(var(--s)*.9);background:#2E1F52;border-radius:58% 42% 52% 48%/55% 48% 52% 45%;position:relative;display:inline-block;flex:0 0 auto;animation:wob 2.2s ease-in-out infinite}
.blot:before,.blot:after{content:"";position:absolute;top:30%;width:24%;height:30%;border-radius:50%;background:radial-gradient(circle at 55% 62%,#23305E 0 32%,#fff 35%)}
.blot:before{left:20%}.blot:after{right:20%}
.blot .hat{position:absolute;left:50%;bottom:80%;transform:translateX(-50%);width:0;height:0;border-left:calc(var(--s)*.26) solid transparent;border-right:calc(var(--s)*.26) solid transparent;border-bottom:calc(var(--s)*.5) solid #6B3FA0}
.blot.mini{--s:46px;margin-top:14px}
.blot.big{--s:118px;margin-top:40px}
.blot:nth-child(2n){animation-delay:-.7s}.blot:nth-child(3n){animation-delay:-1.3s}
@keyframes wob{50%{transform:scale(1.06,.94)}}
.blot.gone{animation:splat .7s forwards}
@keyframes splat{40%{transform:scale(1.35,.55)}100%{transform:translateY(-70px) scale(0) rotate(40deg);opacity:0}}
.blot.hit{animation:hit .45s}
@keyframes hit{30%{transform:translateX(-10px) rotate(-8deg);filter:brightness(2.2)}65%{transform:translateX(10px) rotate(6deg)}}
.slots{gap:8px}
.slot{width:50px;height:50px;border-radius:14px;border:3px dashed #D9C9A8;display:grid;place-items:center;font-size:30px;background:#fff}
.slot.full{border-style:solid;border-color:var(--sun);background:#FFF1C2;animation:pop .45s both}
.slot.plank{width:44px;height:64px;border-radius:8px}
.slot.plank.full{background:repeating-linear-gradient(90deg,#B07A45 0 6px,#A26C3A 6px 8px);border-color:#7A4E25}
.slot.stone{border-radius:6px}
.slot.stone.full{background:linear-gradient(#B9C2D0,#8C97A8);border-color:#6E7889}
.lockst{flex-direction:column}
.cage{width:110px;height:110px;border-radius:55px 55px 14px 14px;display:grid;place-items:center;font-size:56px;background:repeating-linear-gradient(90deg,transparent 0 12px,#8A6A3E 12px 16px),#FFF1C2;border:4px solid #8A6A3E;transition:all .5s}
.cage.free{background:#DDF7EA;border-color:var(--ok)}
.cage.free .npc{animation:jump .6s 3}
@keyframes jump{50%{transform:translateY(-16px)}}
.npc{display:inline-block}
.locks{display:flex;gap:8px;font-size:30px}
.lock.open{animation:pop .4s both}
.boss{flex-direction:column}
.hearts{display:flex;gap:6px;font-size:30px;color:var(--bad)}
.heart.lost{color:#D6E4F0;transform:scale(.8)}
.taunt{display:inline-block;margin-top:10px;background:#2E1F52;color:#fff;font-weight:800;border-radius:16px;padding:6px 12px;font-size:15px;visibility:hidden}
.taunt.on{visibility:visible;animation:pop .3s both}
.qcard .qtext{font-family:var(--display);font-weight:700;font-size:22px;margin:6px 0 12px}
.qhead{display:flex;justify-content:space-between}
.qopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}
.opt.big{font-size:22px;text-align:center;padding:14px 10px;font-family:var(--display)}
.opt[disabled]{cursor:default}
.center{text-align:center}
.center .owl{margin:0 auto}
.cert{background:var(--card);border-radius:26px;padding:24px 18px;text-align:center;border:8px double var(--sun);box-shadow:0 6px 0 var(--sky2)}
.cert .ctop{font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-size:13px}
.cert h2{font-size:40px;color:var(--grape);margin:6px 0}
.cert p{font-weight:700;margin:8px 0}
.cert input.w{width:min(100%,260px);text-align:center;font-size:24px}
.cert .owl{margin:8px auto 0}
.cert .sig{color:var(--muted);font-style:italic}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:440px){body{font-size:17px}.lt{width:40px;height:46px;font-size:22px}input.w{width:104px}.bigbtn h2{font-size:21px}}

/* ---- fact of the day ---- */
.fact{position:relative;display:block;width:100%;text-align:left;background:linear-gradient(135deg,#FFF6D6,#FFE8F1);border-radius:26px;padding:16px 16px 14px;margin-bottom:16px;box-shadow:0 6px 0 #F2D2A6;border:3px solid #FFD36B}
.fact .fk{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#B36B00;display:flex;align-items:center;gap:6px}
.fact .fh{display:flex;gap:12px;align-items:flex-start;margin-top:8px}
.fact .fe{flex:0 0 auto;font-size:46px;line-height:1;width:64px;height:64px;display:grid;place-items:center;background:#fff;border-radius:20px;box-shadow:0 3px 0 #F2D2A6}
.fact h3{font-size:20px;margin-bottom:4px}
.fact p{margin:0;font-weight:700;font-size:18px}
.fact .frow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.fbtn{border-radius:14px;padding:10px 14px;font-weight:800;background:#fff;box-shadow:0 3px 0 #F2D2A6}
.fbtn.main{background:var(--grape);color:#fff;box-shadow:0 3px 0 #5a40c7}
.fbtn.speaking{background:var(--sun);color:var(--ink);box-shadow:0 3px 0 #D9A21E}
.b-enc{background:#1C8FD6} .b-set{background:#fff;color:var(--ink)}
.b-set .ic{background:#EAF4FF}
/* ---- encyclopedia ---- */
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sec{border-radius:22px;padding:14px;color:#fff;text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;gap:4px;min-height:118px}
.sec .se{font-size:38px;line-height:1}
.sec b{font-family:var(--display);font-size:18px}

  } catch (e) {}

let VOICE = false;
try { VOICE = localStorage.getItem('sova-voice') === '1'; } catch (e) {}
const clean = t => String(t).replace(/<[^>]+>/g, ' ').replace(/[→]/g, ', ').replace(/[★☆💡🦉🔊🔇✔✎‹›]/g, '').replace(/\s+/g, ' ').trim();

const VS = { name: '', rate: 0.95 };
try { const o = JSON.parse(localStorage.getItem('sova-vset') || '{}'); if (o.name) VS.name = o.name; if (o.rate) VS.rate = o.rate; } catch (e) {}
const saveVS = () => { try { localStorage.setItem('sova-vset', JSON.stringify(VS)); } catch (e) {} };
function ruVoices() {
  try { return speechSynthesis.getVoices().filter(v => /^ru/i.test(v.lang) || /russian|русск/i.test(v.name)); } catch (e) { return []; }
}
function voiceScore(v) {
  let sc = 0;
  if (/natural|neural|online|premium|enhanced|wavenet/i.test(v.name)) sc += 10;
  if (/google/i.test(v.name)) sc += 6;
  if (/network|-network/i.test(v.name + v.voiceURI)) sc += 4;
  if (v.localService === false) sc += 3;
  if (/svetlana|dariya|milena|alena|ruf|rug|rue/i.test(v.name + v.voiceURI)) sc += 1;
  return sc;
}
const isLive = v => voiceScore(v) >= 6;
function bestVoice() {
  const vs = ruVoices(); if (!vs.length) return null;
  if (VS.name) { const c = vs.find(v => v.name === VS.name); if (c) return c; }
  return vs.slice().sort((a, b) => voiceScore(b) - voiceScore(a))[0];

    let i = 0;
    const next = () => {

      if (i >= parts.length) { onPart && onPart(-1); onEnd && onEnd(); return; }

      const idx = i; let done = false;
      const fin = () => { if (done) return; done = true; i++; next(); };

      u.onend = fin; u.onerror = e => { if (e && e.error === 'interrupted') return; fin(); };

/* ---------- encyclopedia ---------- */
let ENCREAD = {}, ENCSEEN = [];
try { ENCREAD = JSON.parse(localStorage.getItem('sova-encread') || '{}'); ENCSEEN = JSON.parse(localStorage.getItem('sova-encseen') || '[]'); } catch (e) {}
const saveEnc = () => { try { localStorage.setItem('sova-encread', JSON.stringify(ENCREAD)); localStorage.setItem('sova-encseen', JSON.stringify(ENCSEEN)); } catch (e) {} };
const secOf = id => ENC_SECTIONS.find(x => x.id === id);
const PIC = i => (typeof ENC_PICS !== 'undefined' && ENC_PICS[i]) || null;
/* маленькая картинка с запасным эмодзи, если фото не загрузилось (нет интернета) */
function picThumb(i, cls) {
  const p = PIC(i), box = el('span', cls, ENC[i].e);
  if (p) { const im = new Image(); im.alt = ''; im.loading = 'lazy'; im.onload = () => { box.textContent = ''; box.append(im); box.classList.add('hasimg'); }; im.src = p[0]; }

}
function photoView(i) {

  const o = el('div', 'phview');

  const cap = el('div', 'phcap', `${ENC[i].e} ${ENC[i].t}<br><small>Нажми, чтобы закрыть</small>`);
  o.append(big, cap); o.onclick = () => o.remove(); document.body.append(o);

/* Новый факт при каждом входе: берём тот, который ещё не показывали; когда все показаны — начинаем круг заново. */
function pickNewFact() {
  let pool = ENC.map((_, i) => i).filter(i => ENCSEEN.indexOf(i) < 0);
  if (!pool.length) { ENCSEEN = []; pool = ENC.map((_, i) => i); }
  const i = pool[Math.floor(Math.random() * pool.length)];
  ENCSEEN.push(i); saveEnc(); return i;
}
let TODAY = pickNewFact();

function factCard() {

  $('.fe', c).replaceWith(picThumb(TODAY, 'fe'));

function encHome() {
  frame('Энциклопедия', home);
  const read = Object.keys(ENCREAD).length;
  S.append(el('div', 'owlrow', owl('small') + `<div class="bubble">${read ? 'Прочитано уже ' + read + ' из ' + ENC.length + '! Выбирай раздел.' : 'Выбирай раздел — и я расскажу самое интересное!'}</div>`));
  const bar = el('div', 'encbar');
  const q = el('input'); q.type = 'search'; q.placeholder = '🔎 Найти: кит, Луна, сердце…';
  const rnd = el('button', 'go', '🎲 Случайный факт');
  rnd.onclick = () => factPage(Math.floor(Math.random() * ENC.length), encHome, false);
  bar.append(q, rnd); S.append(bar);
  const box = el('div');
  const grid = () => {
    box.innerHTML = '';
    const g = el('div', 'secs');
    ENC_SECTIONS.forEach(sec => {
      const all = ENC.filter(f => f.s === sec.id), r = all.filter(f => ENCREAD[ENC.indexOf(f)]).length;
      const b = el('button', 'sec', `<span class="se">${sec.e}</span><b>${sec.t}</b><small>${r ? '✔ ' + r + ' из ' + all.length : all.length + ' фактов'}</small>`);
      b.style.background = sec.c; b.onclick = () => encSection(sec.id);
      g.append(b);
    });
    box.append(g);
  };
  q.oninput = () => {
    const t = q.value.trim().toLowerCase().replace(/ё/g, 'е');
    if (t.length < 2) { grid(); return; }
    box.innerHTML = '';
    const re = new RegExp('(^|[^а-яa-z])' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    const hits = ENC.map((f, i) => i).filter(i => re.test((ENC[i].t + ' ' + ENC[i].a + ' ' + ENC[i].m).toLowerCase().replace(/ё/g, 'е')));
    box.append(hits.length ? factList(hits, encHome) : el('div', 'note', 'Ничего не нашлось. Попробуй другое слово.'));
  };
  grid(); S.append(box);
}

/* Страница факта: «коротко» + «подробно», чтение вслух с подсветкой предложения. */
function factPage(i, back, autoMore) {
  const f = ENC[i], sec = secOf(f.s);
  frame(sec.t, back);
  ENCREAD[i] = 1; saveEnc();
  const c = el('div', 'fpage');
  c.innerHTML = `<div class="big-e">${f.e}</div><h2>${f.t}</h2><span class="chipsec" style="background:${sec.c}">${sec.e} ${sec.t}</span>`;
  const p = PIC(i);
  if (p) {
    const fig = el('figure', 'ph'); fig.hidden = true;
    const im = new Image(); im.alt = f.t;
    im.onload = () => { fig.hidden = false; $('.big-e', c).hidden = true; };
    im.onerror = () => fig.remove();
    im.src = p[0]; im.onclick = () => photoView(i);
    const cap = el('figcaption', '', `🔍 Нажми на фото, чтобы увеличить · <a href="${p[1]}" target="_blank" rel="noopener">Фото: Викисклад</a> · <a href="${p[2]}" target="_blank" rel="noopener">Википедия</a>`);
    fig.append(im, cap); $('.big-e', c).after(fig);
  }
  const sp = splitSent(f.a), mp = splitSent(f.m);
  const short = el('div', 'short', sp.map(x => `<span>${x}</span>`).join(' '));
  const more = el('div', 'more', mp.map(x => `<span>${x}</span>`).join(' '));
  more.hidden = true;
  const row = el('div', 'frow2');
  const bs = el('button', 'fbtn main', '🔊 Расскажи');
  const bm = el('button', 'fbtn', '📖 Подробно');
  const reset = () => { bs.classList.remove('speaking'); bm.classList.remove('speaking'); bs.textContent = '🔊 Расскажи'; bm.textContent = '📖 Подробно'; };
  const hl = box => k => { [...box.children].forEach((x, j) => x.classList.toggle('now', j === k)); if (k >= 0 && box.children[k]) box.children[k].scrollIntoView({ block: 'nearest', behavior: 'smooth' }); };
  bs.onclick = () => {
    if (bs.classList.contains('speaking')) { stopSay(); reset(); hl(short)(-1); return; }
    reset(); bs.classList.add('speaking'); bs.textContent = '⏹ Стоп';
    sayParts([f.t + '.'].concat(sp), k => hl(short)(k - 1), reset);
  };
  const tellMore = () => {
    more.hidden = false;
    if (bm.classList.contains('speaking')) { stopSay(); reset(); hl(more)(-1); return; }
    reset(); bm.classList.add('speaking'); bm.textContent = '⏹ Стоп';
    if (!sayParts(mp, hl(more), reset)) reset();
  };
  bm.onclick = tellMore;
  short.onclick = bs.onclick;
  row.append(bs, bm);
  c.append(short, more, row);
  const ids = ENC.map((x, j) => j).filter(j => ENC[j].s === f.s), pos = ids.indexOf(i);
  const nav = el('div', 'fnav');
  const pv = el('button', 'listen', '‹ Назад'), nx = el('button', 'go', 'Следующий ›');
  pv.disabled = pos === 0; if (pos === 0) pv.style.opacity = .5;
  pv.onclick = () => factPage(ids[pos - 1], back, false);
  nx.onclick = () => factPage(ids[(pos + 1) % ids.length], back, false);
  nav.append(pv, nx); c.append(nav);
  S.append(c);
  if (autoMore) tellMore();
}

/* ---------- task runner ---------- */
function day(di, ti) {
  const D = DAYS[di], T = D.tasks[ti];
  frame('День ' + (di + 1) + ' · ' + D.name, map);
  const tabs = el('div', 'tabs');
  D.tasks.forEach((t, i) => {
    const s = PROG[di + '-' + i] || 0;
    const b = el('button', 'tab' + (i === ti ? ' on' : ''), `${i + 1}. ${t.title}<small>${'★'.repeat(s) || '☆☆☆'}</small>`);
    b.onclick = () => day(di, i); tabs.append(b);
  });
  S.append(tabs);
  const card = el('div', 'card');
  const tagTxt = { att: 'Внимание', wit: 'Смекалка', trk: 'Хитрый вопрос' }[T.kind];
  card.innerHTML = `<span class="tag ${T.kind}">${tagTxt}</span><h2>${T.title}</h2><div class="explain">${T.explain}</div>`;
  const body = el('div'); const msg = el('div', 'msg');
  card.append(body, msg);
  const readTask = () => T.title + '. ' + T.explain + ' ' + [...body.querySelectorAll('.do')].map(e => e.textContent).join(' ');
  $('h2', card).append(sayBtn(readTask));
  const ctx = { level: 0, done: false,
    ok(t) { msg.className = 'msg ok'; msg.textContent = t || pick(PRAISE); ding(true); speak(msg.textContent); },
    bad(t, e) { msg.className = 'msg bad'; msg.textContent = t || pick(TRY); ding(false); speak(msg.textContent); if (e) shakeIt(e); },
    finish() { if (ctx.done) return; ctx.done = true; const stars = 3 - ctx.level; const key = di + '-' + ti;
      PROG[key] = Math.max(PROG[key] || 0, stars); save(); updTotal(); setTimeout(() => party(stars, di, ti), 500); } };
  RENDER[T.type](T, body, ctx);
  // hints
  const hints = el('div', 'hints');
  const h1 = el('button', 'hbtn', '💡 Подсказка'), h2 = el('button', 'hbtn help', '🦉 Помощь Совушки');
  const box = el('div');
  h1.onclick = () => { ctx.level = Math.max(ctx.level, 1); h1.disabled = true; box.innerHTML = `<div class="hintbox">💡 ${T.hint}</div>`; speak('Подсказка. ' + T.hint); };
  h2.onclick = () => { ctx.level = 2; h1.disabled = true; h2.disabled = true; const hp = typeof T.help === 'function' ? T.help() : T.help;
    box.innerHTML = `<div class="hintbox">💡 ${T.hint}</div><div class="hintbox help">🦉 ${hp}</div>`; speak('Совушка помогает. ' + hp); if (ctx.onHelp) ctx.onHelp(); };
  hints.append(h1, h2);
  card.append(hints, box,
    el('p', 'prog', 'Без подсказок — 3 ★, с подсказкой — 2 ★, с помощью Совушки — 1 ★.'));
  S.append(card);
  speak(readTask());
}

function party(stars, di, ti) {
  $('#powl').innerHTML = owl() .replace('class="owl ', 'style="margin:0 auto" class="owl ');
  $('#ptitle').textContent = stars === 3 ? 'Великолепно!' : stars === 2 ? 'Молодец!' : 'Получилось!';
  $('#pstars').innerHTML = [0, 1, 2].map(i => i < stars ? '<span>★</span>' : '<span><i>★</i></span>').join('');
  const last = ti === DAYS[di].tasks.length - 1;
  $('#ptext').textContent = last ? 'День ' + (di + 1) + ' пройден! Ты собрала ' + dayStars(di) + ' ★.' : 'Переходим к следующему заданию.';
  $('#pnext').textContent = last ? 'К карте недели' : 'Дальше';
  $('#party').hidden = false;
  speak($('#ptitle').textContent + ' ' + $('#ptext').textContent);
  $('#pnext').onclick = () => { $('#party').hidden = true; last ? map() : day(di, ti + 1); };
}

/* ---------- task types ---------- */
const RENDER = {
  hunt(T, body, ctx) {
    let r = 0; const found = new Set();
    const need = ch => [...T.letters].filter(c => c === ch).length;
    T.help = () => 'Букв ' + T.rounds.map(c => c + ' здесь ' + need(c)).join(', а букв ') + '. Я подсветила те, что ты ещё не нашла.';
    const doTxt = el('p', 'do'); const letters = el('div', 'letters'); const cnt = el('div', 'counter');
    const tiles = [...T.letters].map((c, i) => { const b = el('button', 'lt', c); b.onclick = () => tap(i, b); letters.append(b); return b; });
    function upd() { doTxt.innerHTML = r === 0 ? `Нажми на все буквы <b style="color:var(--coral)">${T.rounds[0]}</b> — зачеркни их!` : `Теперь найди все буквы <b style="color:var(--grape)">${T.rounds[1]}</b> — обведи их!`;
      cnt.textContent = 'Нашла: ' + [...found].filter(i => T.letters[i] === T.rounds[r]).length; }
    function tap(i, b) {
      if (ctx.done || found.has(i)) return;
      if (T.letters[i] === T.rounds[r]) { found.add(i); b.classList.add('g' + r); ding(true);
        const got = [...found].filter(k => T.letters[k] === T.rounds[r]).length;
        if (got === need(T.rounds[r])) { if (r === 0) { r = 1; ctx.ok('Все буквы ' + T.rounds[0] + ' найдены! Теперь следующая.'); } else { ctx.ok(); ctx.finish(); } }
        upd();
      } else ctx.bad('Это буква ' + T.letters[i] + '. Посмотри внимательнее!', b);
    }
    ctx.onHelp = () => tiles.forEach((b, i) => { if (!found.has(i) && T.letters[i] === T.rounds[r]) { b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash'); } });
    upd(); body.append(doTxt, letters, cnt);
  },
  chain(T, body, ctx) {
    body.append(el('p', 'do', 'Заполни пустые клеточки. Меняй по одной букве!'));
    const left = new Set(T.chains.map((_, i) => i));
    T.chains.forEach((c, ci) => {
      const row = el('div', 'chain');
      row.append(el('span', 'word', c.from));
      const ins = [];
      for (let s = 0; s < c.steps; s++) { row.append(el('span', 'arr', '→')); const i = el('input', 'w'); i.id = 'ch' + ci + s; i.autocomplete = 'off'; i.setAttribute('autocapitalize', 'off'); ins.push(i); row.append(i); }
      row.append(el('span', 'arr', '→'), el('span', 'word', c.to));
      const go = el('button', 'go', 'Проверить');
      go.onclick = () => {
        let prev = c.from; ins.forEach(i => i.classList.remove('okk', 'badd'));
        for (const i of ins) {
          const w = norm(i.value);
          if (!w) { ctx.bad('Заполни все клеточки.', i); return; }
          if (!oneDiff(prev, w)) { i.classList.add('badd'); ctx.bad('Здесь поменялась не одна буква. Сравни со словом «' + prev.toLowerCase() + '».', i); return; }
          if (!DICT.has(w)) { i.classList.add('badd'); ctx.bad('Такого слова я не знаю. Придумай другое.', i); return; }
          i.classList.add('okk'); prev = w;
        }
        if (!oneDiff(prev, c.to)) { ctx.bad('Из последнего слова должно получаться «' + c.to.toLowerCase() + '» — тоже одной буквой.', ins[ins.length - 1]); return; }
        go.disabled = true; ins.forEach(i => i.disabled = true); left.delete(ci);
        if (left.size) ctx.ok('Цепочка готова! Осталась ещё одна.'); else { ctx.ok(); ctx.finish(); }
      };
      ins.forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') go.click(); }));
      const wrap = el('div', 'group'); wrap.append(row, go); body.append(wrap);
    });
  },
  collect(T, body, ctx) {
    if (T.prompt) body.append(el('p', 'do', T.prompt));
    else body.append(el('p', 'do', 'Найди слова и напиши их по одному.'));
    let left = T.groups.length;
    T.groups.forEach((g, gi) => {
      const box = el('div', 'group'); const got = new Set(); const acc = new Set(g.accept.map(norm));
      const prog = el('span', 'prog');
      const updP = () => prog.textContent = 'Нашла ' + got.size + ' из ' + g.need;
      const row = el('div', 'row'); const i = el('input', 'w'); i.id = 'cl' + gi; i.autocomplete = 'off'; i.setAttribute('autocapitalize', 'off');
      const go = el('button', 'go', 'Проверить'); const chips = el('div', 'chips');
      row.append(i, go, prog);
      const check = () => {
        const w = norm(i.value); if (!w || got.size >= g.need) return;
        if (got.has(w)) { ctx.bad('Это слово уже есть! Найди другое.', i); return; }
        if (acc.has(w)) { got.add(w); chips.append(el('span', 'chip', i.value.trim().toLowerCase())); i.value = ''; updP();
          if (got.size >= g.need) { i.disabled = true; go.disabled = true; left--; if (left) ctx.ok('Здорово! Переходи к следующему.'); else { ctx.ok(); ctx.finish(); } } else ctx.ok();
        } else ctx.bad('Такого слова тут нет. Попробуй ещё!', i);
      };
      go.onclick = check; i.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
      box.append(el('div', 'glab', g.label), row, chips); updP(); body.append(box);
    });
  },
  same(T, body, ctx) {
    body.append(el('p', 'do', 'Одинаковые слова или нет? Нажми на ответ.'));
    let left = T.pairs.length; const wrap = el('div');
    T.pairs.forEach(([a, b]) => {
      const same = a === b; const row = el('div', 'pair');
      const w = el('div', 'pw', `${a} — ${b}`);
      const y = el('button', 'opt', 'Одинаковые'), n = el('button', 'opt', 'Разные');
      const ans = (isSame, btn) => {
        if (row.dataset.done) return;
        if (isSame === same) { row.dataset.done = 1; btn.classList.add('right'); y.disabled = n.disabled = true;
          if (!same) w.innerHTML = a + ' — ' + [...b].map((c, i) => c !== a[i] ? '<b>' + c + '</b>' : c).join('');
          if (--left === 0) { ctx.ok(); ctx.finish(); } else ctx.ok(same ? 'Верно, одинаковые!' : 'Верно! Видишь неправильную букву?');
        } else ctx.bad(null, btn);
      };
      y.onclick = () => ans(true, y); n.onclick = () => ans(false, n);
      row.append(w, y, n); wrap.append(row);
    });
    body.append(wrap);
  },
  quiz(T, body, ctx) {
    let left = T.qs.length;
    T.qs.forEach(q => {
      const box = el('div', 'q'); box.append(el('p', null, q.q)); const opts = el('div', 'opts');
      q.o.forEach((o, i) => { const b = el('button', 'opt', o); b.onclick = () => {
        if (box.dataset.done) return;
        if (i === q.a) { box.dataset.done = 1; b.classList.add('right'); if (--left === 0) { ctx.ok(); ctx.finish(); } else ctx.ok(); }
        else { b.classList.add('wrong'); ctx.bad(null, b); } }; opts.append(b); });
      box.append(opts); body.append(box);
    });
  },
  changed(T, body, ctx) {
    let r = 0;
    const area = el('div'); body.append(area);
    function step1() {
      const R = T.rounds[r]; area.innerHTML = '';
      area.append(el('p', 'do', `Раунд ${r + 1} из ${T.rounds.length}. Запомни слова:`));
      const m = el('div', 'memo'); R.a.forEach(w => m.append(el('span', null, w)));
      const go = el('button', 'go', 'Запомнила!'); go.onclick = step2;
      area.append(m, go); if (r > 0) speak('Раунд ' + (r + 1) + '. Запомни слова.');
    }
    function step2() {
      const R = T.rounds[r]; area.innerHTML = '';
      area.append(el('p', 'do', 'А теперь посмотри. Что изменилось?'));
      const m = el('div', 'memo'); R.b.forEach(w => m.append(el('span', null, w)));
      const opts = el('div', 'opts');
      R.o.forEach((o, i) => { const b = el('button', 'opt', o); b.onclick = () => {
        if (i === R.r) { b.classList.add('right'); r++;
          if (r === T.rounds.length) { ctx.ok(); ctx.finish(); } else { ctx.ok('Верно! Следующий раунд.'); setTimeout(step1, 900); }
        } else { b.classList.add('wrong'); ctx.bad('Нет. Можешь посмотреть слова ещё раз — нажми «Показать снова».', b); } };
        opts.append(b); });
      const again = el('button', 'listen', 'Показать снова'); again.onclick = step1; again.style.marginTop = '10px';
      area.append(m, opts, again);
    }
    step1();
  },
  errors(T, body, ctx) {
    body.append(el('p', 'do', 'Нажми на слова, в которых есть ошибка. Их 4.'));

    let left = Object.keys(fix).length; const t = el('div', 'etext'); const cnt = el('div', 'counter', 'Нашла: 0 из ' + left);
    const total = left;
    T.text.split(' ').forEach(tok => {

        else ctx.bad('Это слово написано правильно.', b);
      };
      t.append(b);
    });
    body.append(t, cnt);
  }
};

function learn(sub) {
  frame('Справочник правил', home);
  const sw = el('div', 'subj');
  const r = el('button', sub === 'ru' ? 'on' : '', 'Русский язык'), m = el('button', sub === 'ma' ? 'on m' : 'm', 'Математика');
  r.onclick = () => learn('ru'); m.onclick = () => learn('ma');
  sw.append(r, m); S.append(sw);
  const lr = el('div', 'owlrow', owl('small') + `<div class="bubble">Выбери тему. Я расскажу простыми словами, а потом проверим, как ты поняла!</div>`);
  $('.owl', lr).onclick = () => say('Выбери тему. Я расскажу простыми словами, а потом проверим, как ты поняла!'); S.append(lr);
  const g = el('div', 'topics');
  LEARN[sub].forEach((tp, i) => {
    const b = el('button', 'tp ' + sub, `<span class="n">${i + 1}</span><span>${tp.t}</span>${LEARNED[sub + i] ? '<span class="ck">✔</span>' : ''}`);
    b.onclick = () => topic(sub, i); g.append(b);
  });
  S.append(g);
}
function topic(sub, i) {
  const tp = LEARN[sub][i];
  frame(tp.t, () => learn(sub));
  const card = el('div', 'card lesson');
  card.innerHTML = `<span class="tag ${sub === 'ru' ? 'wit' : 'att'}" style="background:${sub === 'ru' ? 'var(--mint)' : 'var(--grape)'}">${sub === 'ru' ? 'Русский язык' : 'Математика'}</span><h2>${tp.t}</h2>`;
  tp.p.forEach(p => card.append(el('p', null, p)));
  card.append(el('div', 'example', '<b>Пример</b>' + tp.ex));
  const ls = el('button', 'listen', '🔊 Послушать');
  const lesson = tp.t + '. ' + tp.p.join(' ') + ' Пример: ' + tp.ex + ' А теперь проверь себя: ' + tp.q.q;
  ls.onclick = () => { if (!say(lesson)) ls.textContent = 'Звук не поддерживается'; };
  speak(lesson);
  card.append(ls);
  const q = el('div', 'q'); q.style.marginTop = '14px';
  q.append(el('p', null, 'Проверь себя: ' + tp.q.q)); const opts = el('div', 'opts'); const msg = el('div', 'msg');
  tp.q.o.forEach((o, k) => { const b = el('button', 'opt', o); b.onclick = () => {
    if (q.dataset.done) return;
    if (k === tp.q.a) { q.dataset.done = 1; b.classList.add('right'); msg.className = 'msg ok'; msg.textContent = pick(PRAISE) + ' Тема понятна!'; ding(true); speak(msg.textContent); LEARNED[sub + i] = 1; save(); }
    else { b.classList.add('wrong'); msg.className = 'msg bad'; msg.textContent = 'Перечитай правило ещё раз — ответ там есть.'; ding(false); speak('Послушай правило ещё раз, ответ там есть.'); shakeIt(b); } }; opts.append(b); });
  q.append(opts, msg); card.append(q);
  const nav = el('div', 'hints');
  if (i > 0) { const p = el('button', 'hbtn', '‹ Прошлая тема'); p.onclick = () => topic(sub, i - 1); nav.append(p); }
  if (i < LEARN[sub].length - 1) { const n = el('button', 'hbtn help', 'Следующая тема ›'); n.onclick = () => topic(sub, i + 1); nav.append(n); }
  card.append(nav);
  S.append(card);
}

    ['e:🐢:Черепаха Неспешка', 'Стиралка стёрла мои линейки и часы! Я не знаю, долго ли идти до её замка и далеко ли.'],
    ['o', 'Вспомним меры длины и времени — и найдём дорогу!']],
   lesson: { t: 'Длина и время', p: ['1 дециметр = 10 сантиметров. 1 метр = 100 сантиметров.', 'В одном часе 60 минут, в сутках 24 часа.', 'Периметр — это длина дорожки вокруг фигуры. Складываем длины всех сторон.'], ex: 'Квадрат со стороной 2 см: 2 + 2 + 2 + 2 = 8 см.' },
   quest: { intro: 'Почини 5 часов Мастера Мер!',
    goal: { type: 'fill', n: 5, icon: '⏰', ok: 'Часы затикали!' },
    qs: [{ q: '1 дм = … см', o: ['10', '100', '1'], a: 0, h: 'Дециметр — это десять сантиметров.' },
         { q: 'Сколько минут в одном часе?', o: ['60', '100', '24'], a: 0, h: 'Большая стрелка проходит весь круг за час.' },
         { q: 'Сколько сантиметров в 1 метре?', o: ['100', '10', '1000'], a: 0, h: 'В метре 10 дециметров, а в каждом — по 10 см.' },
         { q: 'Периметр квадрата со стороной 3 см?', o: ['12 см', '9 см', '6 см'], a: 0, h: 'У квадрата 4 одинаковые стороны. Сложи их.' },
         { q: 'Что длиннее?', o: ['1 м', '50 см'], a: 0, h: '1 метр — это 100 сантиметров.' }] },
   win: [['e:🐢:Черепаха Неспешка', 'Часы тикают, линейки на месте! Последняя страница — твоя. А замок Стиралки — вон там, на ледяной горе.'], ['o', 'Все 12 страниц собраны! Осталось победить Стиралку.']] },

 { land: 'Ледяной замок', color: '#3A2E5C', icon: '🏔', subj: 'all',
   scenes: [
    ['n', 'Ледяной замок сверкает на вершине горы. В тронном зале сидит Колдунья Стиралка.'],
    ['k', 'Ты собрала все страницы?! Ну и что! Сейчас я задам тебе самые трудные вопросы — и сотру всё снова!'],
    ['o', 'Ты знаешь все правила 2 класса. Я рядом. Вспомним главное — и в бой!']],
   lesson: { t: 'Вспоминаем всё', p: ['Безударную гласную проверяй ударением: вода — вОды.', 'Парную согласную на конце проверяй гласной после неё: дуб — дубы.', 'Умножение — быстрое сложение. Деление — раздаём поровну.', 'Сначала скобки, потом умножение и деление, потом плюс и минус.', 'Предмет — кто? что? Признак — какой? Действие — что делает?'], ex: 'Ты всё это знаешь. Вперёд!' },
   quest: { intro: 'Финальная битва! У Стиралки 6 сердечек. Каждый верный ответ отнимает одно!',
    goal: { type: 'boss', n: 6, ok: 'Попала! Стиралка слабеет!' },
    qs: [{ q: 'Какая буква пропущена: з..ма?', o: ['и', 'е'], a: 0, h: 'Измени слово: одна зима — много…' },
         { q: '6 × 2 = ?', o: ['12', '8', '62'], a: 0, h: 'Сложи две шестёрки.' },
         { q: 'Как правильно?', o: ['мороз', 'морос'], a: 0, h: 'Проверь: один мороз — сильные…' },
         { q: '20 : 2 = ?', o: ['10', '18', '40'], a: 0, h: 'Раздели 20 поровну на двоих.' },
         { q: 'Найди глагол:', o: ['читает', 'книга', 'интересная'], a: 0, h: 'Глагол отвечает на вопрос «что делает?».' },
         { q: '(7 + 3) × 2 = ?', o: ['20', '13', '12'], a: 0, h: 'Сначала скобки: 7 + 3.' }] },
   win: [['k', 'Ох-ох! Мой ластик сломался! Я больше не могу стирать…'],
         ['n', 'Стиралка съёжилась и превратилась в маленький школьный ластик. Теперь она стирает только ошибки в тетрадках.'],
         ['e:👑:Король', 'Большая Книга Правил снова целая! Ты — Великая Хранительница Королевства Знаний!'],
         ['o', 'Ты прошла весь 2 класс! Я тобой очень горжусь!']] }
];

var BOOKS = [
 { title: 'Королевство Знаний', part: 'Часть 1 · 1 класс', villain: 'Колдун Кляксус', vpre: 'Кляксус', minion: '', mname: 'Кляксёнок', icon: '🏰', color: '#7A5CF0', ch: BOOK1,
   about: 'Колдун Кляксус заляпал королевство кляксами. Победи его!',
   start: 'Колдун Кляксус заляпал Королевство Знаний кляксами! Пройди все земли и спаси королевство. Начнём с первой главы!',
   cert: 'Хранительница Королевства Знаний,<br>победившая колдуна Кляксуса' },
 { title: 'Книга Правил', part: 'Часть 2 · 2 класс', villain: 'Колдунья Стиралка', vpre: 'Стиралка', minion: 'eraser', mname: 'Стирашка', icon: '📖', color: '#E2457F', ch: BOOK2,
   about: 'Колдунья Стиралка стёрла Большую Книгу Правил. Верни все страницы!',
   start: 'Колдунья Стиралка, сестра Кляксуса, стёрла все страницы Большой Книги Правил! Верни 12 страниц и победи её!',
   cert: 'Великая Хранительница Королевства Знаний,<br>победившая Колдунью Стиралку' }
];
var BOOK = 0, TALE = BOOK1;
function pk(i) { return BOOK === 0 ? String(i) : BOOK + '-' + i; }
function bookStars(b) { var s = 0; for (var k in TALEP) { var isB = b === 0 ? k.indexOf('-') < 0 : k.indexOf(b + '-') === 0; if (isB) s += TALEP[k]; } return s; }
function bookDone(b) { var n = 0; for (var i = 0; i < BOOKS[b].ch.length; i++) if (TALEP[b === 0 ? String(i) : b + '-' + i]) n++; return n; }
function openBook(b) { BOOK = b; TALE = BOOKS[b].ch; taleMap(); }
function books() {
  frame('Сказки', home);
  var msg = 'Выбирай сказку! Первая — для 1 класса, вторая — для 2 класса. Можно начинать с любой.';
  var top = el('div', 'owlrow', owl('small') + '<div class="bubble">' + msg + '</div>');
  $('.owl', top).onclick = function () { say(msg); }; S.append(top);
  var g = el('div', 'big');
  BOOKS.forEach(function (B, b) {
    var done = bookDone(b), all = B.ch.length;
    var btn = el('button', 'bigbtn', '<div class="ic">' + B.icon + '</div><div><small class="bpart">' + B.part + '</small><h2>' + B.title + '</h2><p>' + B.about + '</p><p class="bprog">' + (done ? 'Пройдено глав: ' + done + ' из ' + all + ' · ★ ' + bookStars(b) : 'Ещё не начата') + '</p></div>');
    btn.style.background = B.color; btn.onclick = function () { openBook(b); }; g.append(btn);
  });
  S.append(g); speak(msg);
}

var SUBJ = { ru: 'Русский язык', ma: 'Математика', all: 'Всё вместе' };
var TAUNT = ['Хи-хи! Мимо!', 'Ха-ха! Не угадала!', 'Буль-буль! Ошибочка!'];
function blotHTML(cls, hat) { return '<div class="blot ' + (cls || '') + '">' + (hat ? '<i class="hat"></i>' : '') + '</div>'; }
function speaker(who) {
  if (who === 'o') return { name: 'Совушка', por: owl('mini') };
  if (who === 'k') return { name: BOOKS[BOOK].villain, por: blotHTML('mini ' + BOOKS[BOOK].minion, true), bad: true };
  if (who === 'n') return { name: 'Сказочник', por: '<span>📖</span>' };
  var p = who.split(':'); return { name: p[2], por: '<span>' + p[1] + '</span>' };
}
function taleUnlocked(i) { return i === 0 || !!TALEP[pk(i - 1)]; }
function chapHead(i) {
  var C = TALE[i];
  var d = el('div', 'chead', '<span class="cnum" style="background:' + C.color + '">' + (i + 1) + '</span><div><b>Глава ' + (i + 1) + ' · ' + C.land + '</b><small>' + SUBJ[C.subj] + '</small></div>');
  return d;
}

function taleMap() {
  frame(BOOKS[BOOK].title, books);
  var done = 0; for (var i = 0; i < TALE.length; i++) if (TALEP[pk(i)]) done++;
  var msg = done === 0 ? BOOKS[BOOK].start
    : done === TALE.length ? 'Ты спасла королевство! Можешь пройти любую главу ещё раз и собрать все звёзды.'
    : 'Ты прошла глав: ' + done + ' из ' + TALE.length + '. Продолжим сказку?';
  var top = el('div', 'owlrow', owl('small') + '<div class="bubble">' + msg + '</div>');
  $('.owl', top).onclick = function () { say(msg); };
  S.append(top);
  var path = el('div', 'tpath');
  TALE.forEach(function (C, i) {
    var open = taleUnlocked(i), st = TALEP[pk(i)] || 0;
    var b = el('button', 'tnode' + (open ? '' : ' locked') + (st ? ' done' : ''));
    b.innerHTML = '<div class="ticon" style="background:' + C.color + '">' + (open ? C.icon : '🔒') + '</div>' +
      '<div class="tinfo"><small>Глава ' + (i + 1) + ' · ' + SUBJ[C.subj] + '</small><b>' + C.land + '</b>' +
      '<span class="st">' + (st ? '★'.repeat(st) + '<i>' + '★'.repeat(3 - st) + '</i>' : (open ? '<em>Начать ›</em>' : '<em>Сначала пройди прошлую главу</em>')) + '</span></div>';
    b.onclick = function () { if (open) sceneView(i, TALE[i].scenes, 0, function () { lessonView(i); }); else { ding(false); shakeIt(b); } };
    path.append(b);
  });
  S.append(path);
  if (done === TALE.length) { var g = el('button', 'go', '🏆 Моя грамота'); g.style.marginTop = '16px'; g.onclick = certificate; S.append(g); }
}

function sceneView(i, list, k, after) {
  var C = TALE[i]; frame(C.land, taleMap);
  S.append(chapHead(i));
  var sc = list[k], sp = speaker(sc[0]);
  var card = el('div', 'scene' + (sp.bad ? ' bad' : ''));
  card.style.borderTopColor = C.color;
  card.innerHTML = '<div class="por">' + sp.por + '</div><div class="stext"><div class="sname">' + sp.name + '</div><p>' + sc[1] + '</p></div>';
  $('.sname', card).append(sayBtn(function () { return sc[1]; }));
  S.append(card);
  var nav = el('div', 'snav');
  var dots = el('div', 'dots'); for (var d = 0; d < list.length; d++) dots.append(el('span', d === k ? 'on' : ''));
  var nx = el('button', 'go big', k < list.length - 1 ? 'Дальше ›' : 'Продолжить ›');
  nx.onclick = function () { if (k < list.length - 1) sceneView(i, list, k + 1, after); else after(); };
  nav.append(dots, nx); S.append(nav);
  speak(sp.name + '. ' + sc[1]);
}

function lessonView(i) {
  var C = TALE[i], L = C.lesson; frame(C.land, taleMap);
  S.append(chapHead(i));
  var card = el('div', 'card lesson');
  card.innerHTML = '<div class="owlrow" style="margin:0 0 6px">' + owl('small') + '<div><span class="tag" style="background:' + C.color + '">Урок Совушки</span><h2>' + L.t + '</h2></div></div>';
  L.p.forEach(function (p) { card.append(el('p', null, p)); });
  card.append(el('div', 'example', '<b>Пример</b>' + L.ex));
  var text = L.t + '. ' + L.p.join(' ') + ' Пример: ' + L.ex;
  var ls = el('button', 'listen', '🔊 Послушать');
  ls.onclick = function () { if (!say(text)) ls.textContent = 'Звук не поддерживается'; };
  var go = el('button', 'go big', '⚔ К испытанию!'); go.onclick = function () { questView(i); };
  var row = el('div', 'row'); row.append(ls, go); card.append(row);
  S.append(card);
  speak(text);
}

function questView(i) {
  var C = TALE[i], Q = C.quest, G = Q.goal; frame(C.land, taleMap);
  S.append(chapHead(i));
  var st = { q: 0, oops: 0, p: 0 };
  // arena
  var ar = el('div', 'arena'); ar.style.borderColor = C.color;
  var stage = el('div', 'stage'); var items = [];
  if (G.type === 'blots') { for (var b = 0; b < G.n; b++) { var x = el('div', null, blotHTML(BOOKS[BOOK].minion)); items.push(x.firstChild); stage.append(x.firstChild); } }
  else if (G.type === 'fill') { stage.className = 'stage slots'; for (var f = 0; f < G.n; f++) { var s = el('div', 'slot ' + (G.cls || '')); items.push(s); stage.append(s); } }
  else if (G.type === 'locks') { stage.className = 'stage lockst';
    var cage = el('div', 'cage', '<span class="npc">' + G.npc + '</span>'); stage.append(cage); var lr = el('div', 'locks');
    for (var l = 0; l < G.n; l++) { var lk = el('span', 'lock', '🔒'); items.push(lk); lr.append(lk); } stage.append(lr); items.cage = cage; }
  else if (G.type === 'boss') { stage.className = 'stage boss'; var bx = el('div', null, blotHTML('big ' + BOOKS[BOOK].minion, true)); items.boss = bx.firstChild; stage.append(items.boss);
    var hr = el('div', 'hearts'); for (var h = 0; h < G.n; h++) { var ht = el('span', 'heart', '♥'); items.push(ht); hr.append(ht); } stage.append(hr); }
  var taunt = el('div', 'taunt', '…');
  ar.append(el('div', 'aintro', Q.intro), stage, taunt);
  S.append(ar);
  function progress() {
    var k = st.p - 1;
    if (G.type === 'blots') items[k].classList.add('gone');
    else if (G.type === 'fill') { items[k].classList.add('full'); if (G.icon) items[k].textContent = G.icon; }
    else if (G.type === 'locks') { items[k].textContent = '🔓'; items[k].classList.add('open'); if (st.p === G.n) items.cage.classList.add('free'); }
    else if (G.type === 'boss') { items[k].classList.add('lost'); var bb = items.boss; bb.classList.remove('hit'); void bb.offsetWidth; bb.classList.add(st.p === G.n ? 'gone' : 'hit'); }
  }
  function sayTaunt() {
    var t = pick(TAUNT); taunt.textContent = (G.type === 'boss' ? BOOKS[BOOK].vpre : BOOKS[BOOK].mname) + ': ' + t; taunt.classList.remove('on'); void taunt.offsetWidth; taunt.classList.add('on');
    clearTimeout(sayTaunt.tm); sayTaunt.tm = setTimeout(function () { taunt.classList.remove('on'); }, 1800);
  }
  var qcard = el('div', 'card qcard'); S.append(qcard);
  function renderQ() {
    var q = Q.qs[st.q]; qcard.innerHTML = '';
    var used = false;
    var head = el('div', 'qhead', '<span class="prog">Вопрос ' + (st.q + 1) + ' из ' + Q.qs.length + '</span>');
    var qt = el('p', 'qtext', q.q); qt.append(sayBtn(function () { return q.q + (q.o ? ' ' + q.o.join(', или ') : ''); }));
    var msg = el('div', 'msg'); var hintBox = el('div');
    qcard.append(head, qt);
    function good() {
      st.p++; progress(); ding(true); msg.className = 'msg ok'; msg.textContent = G.ok; speak(G.ok);
      setTimeout(function () { st.q++; if (st.q < Q.qs.length) renderQ(); else finish(); }, 1100);
    }
    function bad(btn, text) {
      st.oops++; ding(false); if (btn) shakeIt(btn); sayTaunt();
      msg.className = 'msg bad'; msg.textContent = text || 'Не сдавайся! Подумай ещё или нажми «Подсказка».'; speak(msg.textContent);
    }
    if (q.type === 'pick') {
      var sel = {}; var tiles = el('div', 'letters');
      q.tiles.forEach(function (t) { var b = el('button', 'lt', t); b.onclick = function () { sel[t] = !sel[t]; b.classList.toggle('g1', sel[t]); }; tiles.append(b); });
      var chk = el('button', 'go', 'Проверить');
      chk.onclick = function () {
        var picked = q.tiles.filter(function (t) { return sel[t]; });
        var okk = picked.length === q.ok.length && picked.every(function (t) { return q.ok.indexOf(t) >= 0; });
        if (okk) { chk.disabled = true; good(); } else bad(chk, picked.length < q.ok.length ? 'Ты нашла не все гласные. Поищи ещё!' : 'Среди выбранных есть согласная. Проверь!');
      };
      qcard.append(tiles, chk);
    } else {
      var opts = el('div', 'qopts' + (q.o.length === 2 ? ' two' : ''));
      shuffle(q.o.map(function (o, k) { return { o: o, k: k }; })).forEach(function (it) {
        var b = el('button', 'opt big', it.o);
        b.onclick = function () {
          if (b.disabled || qcard.dataset.lock === String(st.q)) return;
          if (it.k === q.a) { qcard.dataset.lock = String(st.q); b.classList.add('right'); good(); }
          else { b.classList.add('wrong'); b.disabled = true; bad(b); }
        };
        opts.append(b);
      });
      qcard.append(opts);
    }
    var hb = el('button', 'hbtn', '💡 Подсказка Совушки');
    hb.onclick = function () { if (!used) { used = true; st.oops++; } hb.disabled = true; hintBox.innerHTML = '<div class="hintbox">🦉 ' + q.h + '</div>'; speak(q.h); };
    var hrow = el('div', 'hints'); hrow.append(hb);
    qcard.append(msg, hrow, hintBox);
    if (st.q > 0) speak(q.q);
  }
  function finish() {
    var stars = st.oops === 0 ? 3 : st.oops <= 2 ? 2 : 1;
    TALEP[pk(i)] = Math.max(TALEP[pk(i)] || 0, stars); saveTale(); updTotal();
    setTimeout(function () { sceneView(i, C.win, 0, function () { reward(i, stars); }); }, 700);
  }
  renderQ();
  speak(Q.intro + ' ' + Q.qs[0].q);
}

function reward(i, stars) {
  var C = TALE[i]; frame(C.land, taleMap);
  var last = i === TALE.length - 1;
  var card = el('div', 'card center');
  card.innerHTML = owl() + '<h2 style="font-size:28px;margin:6px 0">' + (last ? 'Королевство спасено!' : 'Глава ' + (i + 1) + ' пройдена!') + '</h2>' +
    '<div class="pstars">' + [0, 1, 2].map(function (k) { return k < stars ? '<span>★</span>' : '<span><i>★</i></span>'; }).join('') + '</div>' +
    '<p style="font-weight:700">' + (stars === 3 ? 'Ни одной ошибки! Ты настоящая героиня!' : stars === 2 ? 'Отлично! Почти без ошибок.' : 'Получилось! Можно пройти ещё раз и собрать больше звёзд.') + '</p>';
  var row = el('div', 'row'); row.style.justifyContent = 'center';
  if (last) { var g = el('button', 'go big', '🏆 Моя грамота'); g.onclick = certificate; row.append(g);
    if (BOOK === 0) { var p2 = el('button', 'go big', '📖 Часть 2'); p2.style.background = 'var(--berry)'; p2.onclick = function () { openBook(1); }; row.append(p2); } }
  else { var n = el('button', 'go big', 'Следующая глава ›'); n.onclick = function () { sceneView(i + 1, TALE[i + 1].scenes, 0, function () { lessonView(i + 1); }); }; row.append(n); }
  var m = el('button', 'listen', 'Карта сказки'); m.onclick = taleMap; row.append(m);
  card.append(row); S.append(card);
  speak($('h2', card).textContent + ' ' + $('p', card).textContent);
}

function certificate() {
  frame('Грамота', taleMap);
  var c = el('div', 'cert');
  c.innerHTML = '<div class="ctop">' + BOOKS[BOOK].title + ' · ' + BOOKS[BOOK].part + '</div><h2>Грамота</h2><p>награждается</p>' +
    '<input id="heroName" class="w" placeholder="впиши своё имя" maxlength="20">' +
    '<p>' + BOOKS[BOOK].cert + '</p>' +
    '<div class="pstars" style="font-size:36px">★ ' + bookStars(BOOK) + ' из ' + (TALE.length * 3) + '</div>' + owl('small') + '<p class="sig">Совушка и Король</p>';
  S.append(c);
  var inp = $('#heroName'); inp.value = HERO; inp.style.textTransform = 'none';
  inp.oninput = function () { HERO = inp.value; saveTale(); };
  speak('Грамота. Награждается ' + BOOKS[BOOK].cert.replace('<br>', ' '));
}

$('#voice').onclick = () => setVoice(!VOICE);
if (VOICE) { const b = $('#voice'); b.textContent = '🔊 Говорит'; b.classList.add('on'); b.setAttribute('aria-pressed', 'true'); }
updTotal(); home();
</script>
